plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    // NOTE: org.spongepowered.mixin (MixinGradle) 0.7-SNAPSHOT is incompatible with Gradle 9.x
    // (references the removed org.gradle.util.VersionNumber). ForgeGradle 7 handles mixin
    // refmap generation internally, so the separate Sponge plugin is not needed.
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
}

minecraft {
    // MC 26.1+ ships unobfuscated; ForgeGradle 7 uses official mappings by default — no mappings block needed.
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'mixin.env.remapRefMap', 'true'
            args "-mixin.config=${mod_id}.mixins.json", "-mixin.config=${mod_id}.forge.mixins.json"
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'Shedaniel'
        url 'https://maven.shedaniel.me/'
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    // NOTE: The Mixin AP (org.spongepowered:mixin:processor) is NOT included here.
    // MC 26.1+ is unobfuscated, so refmap generation is a no-op, but the AP version 0.8.5
    // still tries to look up SRG/notch obfuscation tables and fails with compile errors.
    // FG7 MDK omits it too. Mixin annotations are processed at runtime by Forge's own loader.
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'

    // MixinExtras AP still needed for @ModifyExpressionValue / @WrapOperation bootstrap.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))

    // Forge and NeoForge share the same cloth-config artifact for MC 26.x
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}

sourceSets.main.resources.srcDir 'src/generated/resources'
