name: Label existing issues once

on:
  workflow_dispatch:
    inputs:
      state:
        description: Which issues to relabel
        type: choice
        options:
          - open
          - closed
          - all
        default: open

permissions:
  issues: write
  contents: read

jobs:
  collect-issues:
    runs-on: ubuntu-latest
    outputs:
      issue_numbers: ${{ steps.collect.outputs.issue_numbers }}

    steps:
      - name: Collect issue numbers
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATE: ${{ inputs.state }}
        run: |
          numbers="$(gh issue list \
            --repo "$REPO" \
            --state "$STATE" \
            --limit 1000 \
            --json number \
            --jq '[.[].number] | @json')"

          echo "issue_numbers=$numbers" >> "$GITHUB_OUTPUT"

  label-issues:
    needs: collect-issues
    if: ${{ needs.collect-issues.outputs.issue_numbers != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        issue_number: ${{ fromJSON(needs.collect-issues.outputs.issue_numbers) }}

    steps:
      - uses: actions/checkout@v4

      - name: Label issue
        uses: github/issue-labeler@v3.4
        with:
          repo-token: ${{ github.token }}
          configuration-path: .github/labeler.yml
          enable-versioned-regex: 0
          issue-number: ${{ matrix.issue_number }}

          # optional, depending on your normal config:
          include-title: 1
          sync-labels: 0
